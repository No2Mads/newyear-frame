<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>New Year Frame</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}
.frame {
  position: fixed;
  inset: 20px;
  border-radius: 40px;
  border: 5px solid rgba(255,255,255,0.5);
  box-shadow: 0 0 20px rgba(0,255,255,0.6),
              0 0 50px rgba(255,0,255,0.4);
  pointer-events: none;
}
.light {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: blink 2s infinite alternate;
}
@keyframes blink {
  from { opacity: 0.3; }
  to { opacity: 1; }
}
</style>
</head>
